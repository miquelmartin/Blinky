name: Pull request verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ready-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a current ready pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { assertCurrentPR } = require('./.github/scripts/ready-ci.cjs');
            await assertCurrentPR({ github, context });
      - name: Conservatively classify the complete merge diff
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ready-ci.cjs classify

  python:
    name: Python and policy tests
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sender and release-configuration tests
        run: |
          python3 -m unittest discover -s sender -p 'test_*.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          node --test .github/scripts/test-ready-ci.cjs

  android:
    name: Android verification
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      evidence: ${{ steps.evidence.outputs.result }}
    steps:
      - name: Require an explicit change-classification decision
        env:
          ANDROID: ${{ needs.plan.outputs.android }}
        run: |
          case "$ANDROID" in
            true|false) ;;
            *) echo "::error::Missing or invalid Android decision"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.android == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: needs.plan.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, lint and run Android unit tests without release credentials
        if: needs.plan.outputs.android == 'true'
        run: sh ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Enable the Android emulator's KVM access
        if: needs.plan.outputs.android == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run existing instrumentation tests on an emulator
        if: needs.plan.outputs.android == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: sh ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Record completed verification or proven irrelevance
        id: evidence
        env:
          ANDROID: ${{ needs.plan.outputs.android }}
        run: |
          case "$ANDROID" in
            true) echo 'result=verified' >> "$GITHUB_OUTPUT" ;;
            false) echo 'result=proven-unnecessary' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  gate:
    name: Ready verification
    if: always()
    needs: [plan, python, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject missing, unsuccessful or stale verification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const { assertResults, assertCurrentPR } = require('./.github/scripts/ready-ci.cjs');
            assertResults(JSON.parse(process.env.VERIFICATION_NEEDS));
            await assertCurrentPR({ github, context });
      - name: Reject cancellation even after dependencies have succeeded
        if: always() && cancelled()
        run: exit 1
      - name: Require a successful gate
        if: always()
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          test "$PRIOR_STATUS" = success
