name: Temporary hosted disk preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    name: Measure exact hosted SDK cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        timeout-minutes: 1
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove only unused preinstalled .NET SDKs and measure API 37 setup
        timeout-minutes: 3
        run: timeout --kill-after=3s 180s python3 .github/scripts/hosted_disk_preflight.py
