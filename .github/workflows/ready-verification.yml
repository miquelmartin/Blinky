name: Temporary API37 startup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-diagnostic:
    name: Startup diagnostic only - not verification
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Enable KVM
        timeout-minutes: 1
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Startup only with unchanged API37 hardware
        timeout-minutes: 6
        run: timeout --kill-after=10s 330s python3 .github/scripts/probe_android_startup.py
      - name: Retain bounded startup diagnostics
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: api37-startup-only
          path: ${{ runner.temp }}/probe-*.txt
          if-no-files-found: error
          retention-days: 3
