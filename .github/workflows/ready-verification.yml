name: Temporary read-only storage probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  storage:
    name: Inspect temporary storage only
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Read capacity mount and permissions
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          for location in "$RUNNER_TEMP" /mnt; do
            printf '\nLocation: %s\n' "$location"
            if test -d "$location"; then
              timeout --kill-after=1s 5s df -B1 --output=source,fstype,size,used,avail,target "$location"
              timeout --kill-after=1s 5s findmnt -T "$location" -o TARGET,SOURCE,FSTYPE,OPTIONS
              timeout --kill-after=1s 5s stat -c 'device=%d owner=%U group=%G mode=%a type=%F' "$location"
              if test -w "$location" && test -x "$location"; then
                echo 'current-user-writable-and-searchable=yes'
              else
                echo 'current-user-writable-and-searchable=no'
              fi
            else
              echo 'directory=absent'
            fi
          done
